<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rememes - Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { background: #0A0A0B; color: #F5F5F7; font-family: 'Inter', sans-serif; margin: 0; padding-bottom: 70px; }
    .app-container { max-width: 480px; margin: 0 auto; padding: 0 16px; }
    .app-header { position: sticky; top: 0; background: rgba(10,10,11,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.06); padding: 10px 0; z-index: 10; display: flex; align-items: center; gap: 12px; }
    .heading { font-size: 1.5rem; font-weight: 700; }
    .search-input { width: 100%; padding: 12px 16px; background: #1A1A1D; border: 1px solid #2B2B30; border-radius: 10px; color: #F5F5F7; font-size: 0.95rem; outline: none; }
    .search-input:focus { border-color: #C7C7CC; }
    .result-section { margin: 20px 0; }
    .section-title { font-size: 0.8rem; font-weight: 600; color: #9E9EA3; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    .user-result { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #2B2B30; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: #212125; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.875rem; color: #9E9EA3; overflow: hidden; }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .user-info { display: flex; flex-direction: column; }
    .user-name { font-weight: 600; }
    .post-result { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #2B2B30; }
    .post-thumb { width: 48px; height: 48px; border-radius: 8px; background: #212125; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .post-thumb img, .post-thumb video { width: 100%; height: 100%; object-fit: cover; }
    .post-caption { flex: 1; font-size: 0.875rem; }
    .empty-state { text-align: center; color: #9E9EA3; padding: 40px 0; }
    a { text-decoration: none; color: inherit; }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <a href="index.html" style="color:#F5F5F7; text-decoration:none;">←</a>
      <div class="heading">Search</div>
    </header>

    <input type="text" id="search-input" class="search-input" placeholder="Search users, memes..." autofocus />

    <div id="results-container"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
  <script type="module" src="/src/authGuard.ts"></script>
  <script type="module" src="/src/search.ts"></script>
</body>
</html>
