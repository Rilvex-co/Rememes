<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rememes - Post</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { background: #0A0A0B; color: #F5F5F7; font-family: 'Inter', sans-serif; margin: 0; padding-bottom: 70px; }
    .app-container { max-width: 480px; margin: 0 auto; padding: 0 16px; }
    .app-header { position: sticky; top: 0; background: rgba(10,10,11,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #2B2B30; padding: 12px 0; z-index: 10; display: flex; align-items: center; gap: 12px; }
    .heading { font-size: 1.5rem; font-weight: 700; }
    .post-card { background: #111113; border: 1px solid #2B2B30; border-radius: 14px; margin-bottom: 16px; overflow: hidden; }
    .post-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #2B2B30; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #212125; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.75rem; color: #9E9EA3; }
    .post-author-info { display: flex; flex-direction: column; }
    .post-author { font-weight: 600; font-size: 0.875rem; }
    .post-meta { font-size: 0.7rem; color: #6E6E73; }
    .post-media { width: 100%; background: #1A1A1D; display: flex; align-items: center; justify-content: center; }
    .post-media img, .post-media video { width: 100%; max-height: 480px; object-fit: contain; display: block; }
    .post-content { padding: 16px; }
    .post-caption { margin-bottom: 12px; font-size: 0.875rem; }
    .post-actions { display: flex; gap: 16px; padding-top: 12px; border-top: 1px solid #2B2B30; }
    .action-button { display: flex; align-items: center; gap: 8px; background: none; border: none; color: #9E9EA3; font-size: 0.875rem; cursor: pointer; padding: 8px; border-radius: 6px; }
    .action-button:hover { background: #1A1A1D; }
    .action-button.remix { color: #C7C7CC; font-weight: 600; }
    .comments-section { margin-top: 20px; }
    .comment-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #2B2B30; }
    .comment-avatar { width: 28px; height: 28px; border-radius: 50%; background: #212125; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.7rem; color: #9E9EA3; }
    .comment-body { flex: 1; }
    .comment-username { font-weight: 600; font-size: 0.875rem; }
    .comment-content { font-size: 0.875rem; color: #F5F5F7; margin: 4px 0; }
    .comment-time { font-size: 0.7rem; color: #6E6E73; }
    .add-comment-form { margin-top: 20px; display: flex; gap: 10px; }
    input[type="text"] { flex: 1; padding: 10px 12px; background: #1A1A1D; border: 1px solid #2B2B30; border-radius: 8px; color: #F5F5F7; font-size: 0.875rem; outline: none; }
    input[type="text"]:focus { border-color: #C7C7CC; }
    .btn-primary { padding: 10px 16px; background: #FFFFFF; color: #000; border: none; border-radius: 8px; font-weight: 600; font-size: 0.875rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <a href="index.html" style="color:#F5F5F7; text-decoration:none;">←</a>
      <div class="heading">Post</div>
    </header>

    <div id="post-container"></div>
    



    <div class="comments-section">
      <h3 class="title" style="font-size:1rem; font-weight:600;">Comments</h3>
      <div id="comments-container"></div>
    </div>

    <form class="add-comment-form" id="comment-form">
      <input type="text" id="comment-input" placeholder="Add a comment..." required />
      <button type="submit" class="btn-primary">Post</button>
    </form>
  </div>

  <script type="module" src="/src/main.ts"></script>
  <script type="module" src="/src/authGuard.ts"></script>
  <script type="module" src="/src/post.ts"></script>
</body>
</html>
