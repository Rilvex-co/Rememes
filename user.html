  <style>
    body { background: #0A0A0B; color: #F5F5F7; font-family: 'Inter', sans-serif; margin: 0; padding-bottom: 70px; }
    .app-container { max-width: 480px; margin: 0 auto; padding: 0 16px; }
    .app-header { position: sticky; top: 0; background: rgba(10,10,11,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #2B2B30; padding: 12px 0; z-index: 10; display: flex; align-items: center; gap: 12px; }
    .heading { font-size: 1.5rem; font-weight: 700; }
    .profile-header { background: #111113; border: 1px solid #2B2B30; border-radius: 14px; padding: 16px; margin: 16px 0; box-shadow: 0 8px 24px rgba(0,0,0,0.4); display: flex; flex-direction: column; gap: 16px; }
    .profile-top { display: flex; align-items: center; gap: 18px; }
    .profile-avatar {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  font-weight: 700;
  color: #F5F5F7;
  background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05));
  border: 2px solid transparent;
  background-clip: padding-box;
  box-shadow: 0 8px 20px rgba(0,0,0,0.5);
  position: relative;
  z-index: 1;
} .profile-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .profile-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .profile-info { flex: 1; }
    .profile-username { font-size: 1.125rem; font-weight: 600; }
    .profile-bio { font-size: 0.875rem; color: #9E9EA3; margin-top: 4px; }
    .profile-meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }
    .meta-item { text-align: center; flex: 1; }
    .meta-value { font-weight: 700; font-size: 1rem; }
    .meta-label { font-size: 0.7rem; color: #9E9EA3; }
    .profile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
    .grid-item { aspect-ratio: 1; background: #1A1A1D; border-radius: 8px; overflow: hidden; }
    .grid-item img, .grid-item video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .empty-state { text-align: center; color: #9E9EA3; padding: 32px 0; }
  
.follow-btn {
  background: #FFFFFF;
  color: #000;
  border: none;
  padding: 8px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 0.875rem;
  cursor: pointer;
  margin-top: 12px;
}
.follow-btn.following {
  background: #1A1A1D;
  color: #F5F5F7;
  border: 1px solid #2B2B30;
}

.profile-divider {
  border: none;
  border-top: 2px solid #3A3A44;
  height: 2px;
  margin: 24px 0 16px;
  width: 100%;
  display: block;
  background: transparent;
}
.profile-subdivider {
  border: none;
  border-top: 1px solid #2B2B30;
  margin: 16px 0 16px;
  width: 100%;
  display: block;
}

.streak-inactive {
  filter: grayscale(100%);
  opacity: 0.5;
}
