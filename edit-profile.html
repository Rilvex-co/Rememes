<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rememes - Edit Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { background: #0A0A0B; color: #F5F5F7; font-family: 'Inter', sans-serif; margin: 0; padding-bottom: 70px; }
    .app-container { max-width: 480px; margin: 0 auto; padding: 0 16px; }
    .app-header { position: sticky; top: 0; background: rgba(10,10,11,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #2B2B30; padding: 12px 0; z-index: 10; display: flex; align-items: center; gap: 12px; }
    .heading { font-size: 1.5rem; font-weight: 700; }
    .form-group { margin: 16px 0; }
    label { display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 6px; color: #C7C7CC; }
    input[type="text"], textarea { width: 100%; padding: 10px 12px; background: #1A1A1D; border: 1px solid #2B2B30; border-radius: 8px; color: #F5F5F7; font-size: 0.875rem; }
    input[type="file"] { width: 100%; padding: 10px; background: #1A1A1D; border: 1px solid #2B2B30; border-radius: 8px; color: #F5F5F7; }
    .btn-primary { width: 100%; padding: 12px; background: #FFFFFF; color: #000; border: none; border-radius: 8px; font-weight: 600; font-size: 0.875rem; cursor: pointer; }
    .current-avatar { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; color: #9E9EA3; margin-bottom: 12px; background: linear-gradient(#212125, #212125) padding-box, linear-gradient(90deg, #FFFFFF 50%, #9E9EA3 50%) border-box; border: 2px solid transparent; } .current-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .current-avatar img { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <a href="profile.html" style="color:#F5F5F7; text-decoration:none;">←</a>
      <div class="heading">Edit Profile</div>
    </header>

    <div id="edit-container"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
  <script type="module" src="/src/authGuard.ts"></script>
  <script type="module" src="/src/edit-profile.ts"></script>
</body>
</html>
