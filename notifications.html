<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rememes - Notifications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { background: #0A0A0B; color: #F5F5F7; font-family: 'Inter', sans-serif; margin: 0; padding-bottom: 70px; }
    .app-container { max-width: 480px; margin: 0 auto; padding: 0 16px; }
    .app-header { position: sticky; top: 0; background: rgba(10,10,11,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #2B2B30; padding: 12px 0; z-index: 10; display: flex; align-items: center; gap: 12px; }
    .heading { font-size: 1.5rem; font-weight: 700; }
    .notification-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #2B2B30; }
    .notification-avatar { width: 36px; height: 36px; border-radius: 50%; background: #212125; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.875rem; color: #9E9EA3; }
    .notification-body { flex: 1; }
    .notification-text { font-size: 0.875rem; }
    .notification-time { font-size: 0.7rem; color: #6E6E73; margin-top: 4px; }
    .empty-state { text-align: center; color: #9E9EA3; padding: 32px 0; }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <a href="index.html" style="color:#F5F5F7; text-decoration:none;">←</a>
      <div class="heading">Notifications</div>
    </header>

    <div id="notifications-container"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
  <script type="module" src="/src/authGuard.ts"></script>
  <script type="module" src="/src/notifications.ts"></script>
</body>
</html>
