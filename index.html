<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Rememes - Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    body { background: #0A0A0B; color: #F5F5F7; font-family: 'Inter', sans-serif; margin: 0; padding-bottom: 70px; }
    .app-container { max-width: 480px; margin: 0 auto; padding: 0 16px; }
    .app-header { position: sticky; top: 0; background: rgba(10,10,11,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #2B2B30; padding: 12px 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; }
    .heading { font-size: 1.5rem; font-weight: 700; }
    .feed-filters { display: flex; gap: 12px; margin: 16px 0; background: transparent; }
    .filter-chip { padding: 8px 16px; border-radius: 999px; background: #1A1A1D; color: #9E9EA3; font-size: 0.875rem; font-weight: 500; border: 1px solid #2B2B30; cursor: pointer; }
    .filter-chip.active { background: #FFF; color: #000; border-color: #FFF; }
    .post-card { background: #111113; border: 1px solid #2B2B30; border-radius: 14px; margin-bottom: 16px; overflow: hidden; }
    .post-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #2B2B30; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #212125; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.75rem; color: #9E9EA3; }
    .post-author-info { display: flex; flex-direction: column; }
    .post-author { font-weight: 600; font-size: 0.875rem; }
    .post-meta { font-size: 0.7rem; color: #6E6E73; }
    .post-media { width: 100%; background: #1A1A1D; display: flex; align-items: center; justify-content: center; }
    .post-media img, .post-media video { width: 100%; max-height: 480px; object-fit: contain; display: block; }
    .post-content { padding: 16px; }
    .post-caption { margin-bottom: 12px; font-size: 0.875rem; }
    .post-actions { display: flex; gap: 16px; padding-top: 12px; border-top: 1px solid #2B2B30; }
    .action-button { display: flex; align-items: center; gap: 8px; background: none; border: none; color: #9E9EA3; font-size: 0.875rem; cursor: pointer; padding: 8px; border-radius: 6px; }
    .action-button:hover { background: #1A1A1D; }
    .action-button.remix { color: #C7C7CC; font-weight: 600; }
    .action-button.liked { color: #FF453A; }
  
    html, body { height: 100%; overflow: hidden; }
    .app-container { height: 100vh; display: flex; flex-direction: column; }
    .app-header { flex-shrink: 0; }
    .feed-filters { flex-shrink: 0; }
    main {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 70px;
      scroll-snap-type: none;
    }

    main#feed-container {
      margin-left: -16px;
      margin-right: -16px;
    }
    .post-card {
      border-radius: 0;
      border-left: none;
      border-right: none;
      margin-bottom: 0;
    }
    .post-media img, .post-media video {
      width: 100%;
      object-fit: cover;
    }

    .app-header {
      background: rgba(10,10,11,0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.06);

    .heading {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .heading .logo-dot {
      width: 8px;
      height: 8px;
      background: #FFFFFF;
      border-radius: 50%;
      display: inline-block;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-left: auto;
    }
    .header-action-btn {
      background: none;
      border: none;
      color: #C7C7CC;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px;
      position: relative;
      transition: color 0.2s;
    }
    .header-action-btn:active { color: #FFFFFF; }
    .header-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #212125;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: #F5F5F7;
      overflow: hidden;
    }
    .header-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .search-expandable {
      position: absolute;
      top: 100%;
      right: 0;
      width: 200px;
      padding: 8px;
      background: #111113;
      border: 1px solid #2B2B30;
      border-radius: 10px;
      display: none;
      z-index: 1000;
    }
    .search-expandable.active { display: block; }
    .search-expandable input {
      width: 100%;
      padding: 8px 10px;
      background: #1A1A1D;
      border: 1px solid #2B2B30;
      border-radius: 6px;
      color: #F5F5F7;
      font-size: 0.85rem;
      outline: none;
    }

.avatar img {
  width: 100%;

  border-radius: 50%;

    .header-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .header-right { display: flex; align-items: center; gap: 14px; }
    .search-bar { display: flex; align-items: center; gap: 8px; background: #1A1A1D; border: 1px solid #2B2B30; border-radius: 20px; padding: 6px 12px; text-decoration: none; color: #9E9EA3; font-size: 0.85rem; }
    .search-bar-icon { font-size: 0.9rem; }
    .search-bar-placeholder { color: rgba(255,255,255,0.25); font-style: italic; letter-spacing: 0.3px; }

/* Feed adjustments */
.post-card {
  margin-bottom: 0 !important;
  border-radius: 0 !important;
  border-left: none !important;
  border-right: none !important;
}
.post-media {
  aspect-ratio: 4 / 5 !important;
  max-height: none !important;
}
.post-media img,
.post-media video {
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  max-height: none !important;
}

    /* Stretch home header full width */
    .app-header {
      margin-left: -16px !important;
      margin-right: -16px !important;
      padding-left: 16px !important;
      padding-right: 16px !important;
    }
</style>
