.post-row {
  position: relative;

.post-connector {
  position: absolute;
  left: 20px; /* center of avatar (40px / 2) */
  top: 46px; /* moved down slightly */

  width: 2px;
  background: #4A4A55;
  border-radius: 2px;
  z-index: 1;
}
.post-connector .connector-curve {
  position: absolute;
  left: -2px; /* align with vertical line */
  bottom: 0;
  width: 34px;
  height: 20px;
  z-index: 1;
}
